name: Build source-faithful Green Groove

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_exact.py
      - .github/workflows/build-source-faithful.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Build directly from the licensed/source-faithful Osmo DOM
        run: python build_exact.py
      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate source-faithful Green Groove [skip ci]"
          git push
