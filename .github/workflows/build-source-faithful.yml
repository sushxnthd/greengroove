name: Build source-faithful Green Groove

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_exact.py
      - tailor_v2.py
      - tailor_v3.py
      - brand_apply.py
      - brand_apply_v2.py
      - brand_viewbox_fix.py
      - footer_osmo_exact.py
      - micrographics_apply.py
      - favicon-source.svg
      - '*.fragment.html'
      - .github/workflows/build-source-faithful.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Build directly from the licensed/source-faithful Osmo DOM
        run: python build_exact.py
      - name: Tailor Green Groove content without changing source geometry
        run: python tailor_v2.py index.html
      - name: Apply source-safe micro-tailoring
        run: python tailor_v3.py index.html
      - name: Apply canonical Green Groove header and hero assets
        run: python brand_apply.py index.html
      - name: Apply canonical Green Groove compact and footer assets
        run: python brand_apply_v2.py index.html
      - name: Normalize canonical Green Groove SVG geometry
        run: python brand_viewbox_fix.py index.html
      - name: Rebuild footer for exact Osmo path animation
        run: python footer_osmo_exact.py index.html
      - name: Replace remaining Osmo micrographics
        run: python micrographics_apply.py index.html
      - name: Apply canonical favicon artwork
        run: cp favicon-source.svg favicon.svg
      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate and refine source-faithful Green Groove [skip ci]"
          git push