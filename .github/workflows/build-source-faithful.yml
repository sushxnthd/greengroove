name: Green Groove public-site checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - public-launch.*
      - public_launch.py
      - assets/**
      - scripts/**
      - .github/workflows/build-source-faithful.yml
  pull_request:
permissions:
  contents: read
concurrency:
  group: green-groove-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4 playwright==1.63.0
      - name: Validate public dependencies, labels and routes
        run: python scripts/check_public_site.py
      - name: Validate JavaScript syntax
        run: |
          node --check public-launch.js
          node --check assets/vendor/animation-runtime.js
      - name: Check shopping flow, navigation, dialogs and responsive layouts
        run: python scripts/check_public_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-groove-public-qa
          path: |
            docs/visual-qa/public-static-audit.json
            docs/visual-qa/browser/
