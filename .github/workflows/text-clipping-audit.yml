name: Focused text clipping audit

on:
  push:
    branches: [main]
    paths:
      - qa_text_clipping.py
      - .github/workflows/text-clipping-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit rendered text clipping
        run: python qa_text_clipping.py
      - name: Publish clipping report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-text-clipping.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish text clipping audit [skip ci]"
          git pull --rebase origin main
          git push
