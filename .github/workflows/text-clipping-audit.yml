name: Focused text clipping audit

on:
  push:
    branches: [main]
    paths:
      - qa_text_clipping.py
      - .github/workflows/text-clipping-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit rendered text clipping
        run: python qa_text_clipping.py
      - name: Archive clipping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-text-clipping-report
          path: qa-text-clipping.json
          if-no-files-found: error
