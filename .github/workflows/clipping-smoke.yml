name: Green Groove clipping smoke test

on:
  push:
    branches: [main]
    paths:
      - text_clipping_fix.py
      - qa_text_clipping.py
      - .github/workflows/clipping-smoke.yml

permissions:
  contents: read

jobs:
  clipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pillow numpy playwright
      - run: python -m playwright install --with-deps chromium
      - name: Generate current site through clipping fix
        run: |
          python build_exact.py
          python tailor_v2.py index.html
          python tailor_v3.py index.html
          python admissions_content.py index.html
          python admissions_content_v2.py index.html
          python brand_apply.py index.html
          python brand_apply_v2.py index.html
          python brand_viewbox_fix.py index.html
          python footer_osmo_exact.py index.html
          python micrographics_apply.py index.html
          python media_integrity.py index.html
          python semantic_routes.py index.html
          python text_clipping_fix.py index.html
          python production_cleanup.py index.html
          python qa_markers.py index.html
      - name: Audit clipping
        run: |
          python qa_text_clipping.py
          cat qa-text-clipping.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipping-smoke-report
          path: qa-text-clipping.json
